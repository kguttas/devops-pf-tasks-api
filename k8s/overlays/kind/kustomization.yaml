# Entorno de pruebas efímero (cluster kind creado por el pipeline o localmente).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
components:
  - ../../components/off-hours
images:
  - name: ghcr.io/OWNER/tasks-api
    newName: tasks-api
    newTag: local
patches:
  - target:
      kind: ConfigMap
      name: tasks-api-config
    patch: |-
      - op: add
        path: /data/APP_ENV
        value: kind
  # Cluster de 1 nodo: menos réplicas máximas.
  - target:
      kind: HorizontalPodAutoscaler
      name: tasks-api
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 5
