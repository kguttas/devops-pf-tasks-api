apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tasks-api

labels:
  - pairs:
      app.kubernetes.io/part-of: tasks-api
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - policies.yaml
  - redis.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

images:
  - name: ghcr.io/OWNER/tasks-api
    newName: ghcr.io/OWNER/tasks-api
    newTag: latest
