# Redis: estado compartido entre las réplicas de tasks-api (el HPA crea varias).
# FinOps: 1 réplica con emptyDir (sin volumen persistente pagado); es un entorno de demostración.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasks-api-redis
  labels:
    app.kubernetes.io/name: tasks-api-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tasks-api-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tasks-api-redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.2-alpine
          args: ["--save", "60", "1", "--maxmemory", "48mb", "--maxmemory-policy", "noeviction"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tasks-api-redis
  labels:
    app.kubernetes.io/name: tasks-api-redis
spec:
  selector:
    app.kubernetes.io/name: tasks-api-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# Solo los Pods de la app pueden conectarse a Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tasks-api-redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tasks-api-redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tasks-api
      ports:
        - port: 6379
