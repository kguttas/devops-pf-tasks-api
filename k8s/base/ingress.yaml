apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tasks-api
  labels:
    app.kubernetes.io/name: tasks-api
  annotations:
    # Límite de peticiones por IP en el ingress-nginx (protección básica ante abuso).
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/proxy-body-size: "16k"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tasks-api
                port:
                  name: http
