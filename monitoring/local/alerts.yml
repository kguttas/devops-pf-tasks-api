# Mismas reglas de la app que en Kubernetes (sin las que dependen de kube-state-metrics).
groups:
  - name: tasks-api
    rules:
      - alert: TasksApiDown
        expr: absent(up{job="tasks-api"} == 1)
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "tasks-api no tiene instancias activas"
      - alert: TasksApiHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="tasks-api",status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total{job="tasks-api"}[5m])), 1e-9) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Más del 5% de respuestas 5xx en tasks-api"
      - alert: TasksApiHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="tasks-api"}[5m]))) > 0.5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Latencia p95 de tasks-api sobre 500 ms"
