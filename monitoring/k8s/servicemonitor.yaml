apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tasks-api
  namespace: monitoring
  labels:
    app.kubernetes.io/name: tasks-api
spec:
  namespaceSelector:
    matchNames: ["tasks-api"]
  selector:
    matchLabels:
      app.kubernetes.io/name: tasks-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
